name: DHSRateLimiter
version: '1.0.0'
main: io.Sriptirc_wp_1484.dhsratelimiter.Dhsratelimiter
api-version: '1.21'
authors: ['wp:1484']
description: '限制 Distant Horizons Support (DHS) 插件 LOD 区块加载速率的 Bukkit 插件，支持固定限速与 TPS 动态调节'

commands:
  dhsrate:
    description: '查看/管理 DHSRateLimiter 限速状态'
    usage: '/dhsrate <status|reload|toggle>'
    aliases: [dhsr, drl]
    permission: dhsratelimiter.admin

permissions:
  dhsratelimiter.admin:
    description: '允许使用 /dhsrate 命令'
    default: op
